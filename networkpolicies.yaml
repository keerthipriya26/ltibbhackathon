#write a manifest file for networkpolicies
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: my-network-policy
spec:
  podSelector:
    matchLabels:
      app: my-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: my-namespace
    ports:
    - protocol: TCP
      port: 80 
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: my-db
          
